<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Top Accent Bar Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Magnetic Flux Gradient (Thermal/FEA B-Field Style) -->
    <linearGradient id="fluxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#f59e0b" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="1.0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Right Side: Electromagnetic FEA & Maglev Visual Art -->
  <g transform="translate(730, 40)">
    <!-- FEA Viewport Container -->
    <rect x="0" y="0" width="430" height="280" rx="16" fill="#0b1120" stroke="#334155" stroke-width="1.6"/>
    
    <!-- Viewport Header -->
    <rect x="0" y="0" width="430" height="34" rx="16" fill="#1e293b"/>
    <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="4.5" fill="#22c55e"/>
    <text x="75" y="21" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">ANSYS MAXWELL 3D — STATIK MANYETIK ANALIZ [B-FIELD &amp; LEVITASYON]</text>

    <!-- U-Core Electromagnet (Top Stator) -->
    <!-- Core Back Iron -->
    <path d="M 90 70 L 340 70 L 340 115 L 295 115 L 295 160 L 250 160 L 250 115 L 180 115 L 180 160 L 135 160 L 135 115 L 90 115 Z" 
          fill="#334155" stroke="#64748b" stroke-width="2"/>
    
    <!-- Copper Coils (Winding) around Poles -->
    <!-- Left Coil -->
    <rect x="120" y="115" width="25" height="42" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <line x1="120" y1="125" x2="145" y2="125" stroke="#b45309" stroke-width="1.2"/>
    <line x1="120" y1="135" x2="145" y2="135" stroke="#b45309" stroke-width="1.2"/>
    <line x1="120" y1="145" x2="145" y2="145" stroke="#b45309" stroke-width="1.2"/>
    
    <!-- Center / Right Coil -->
    <rect x="285" y="115" width="25" height="42" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <line x1="285" y1="125" x2="310" y2="125" stroke="#b45309" stroke-width="1.2"/>
    <line x1="285" y1="135" x2="310" y2="135" stroke="#b45309" stroke-width="1.2"/>
    <line x1="285" y1="145" x2="310" y2="145" stroke="#b45309" stroke-width="1.2"/>

    <!-- Levitated Target Armature (Floating Plate) -->
    <rect x="80" y="200" width="270" height="34" rx="5" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <text x="215" y="222" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">LEVITASYON HEDEF PLAKASI (ARMATURE)</text>

    <!-- Magnetic Flux Lines Across Air Gap (5mm) with FEA Rainbow Colors -->
    <!-- Left Pole Loop -->
    <path d="M 135 160 C 135 185, 110 185, 110 200" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.85"/>
    <path d="M 155 160 C 155 182, 140 182, 140 200" fill="none" stroke="#22c55e" stroke-width="3.5" opacity="0.95"/>
    <path d="M 175 160 C 175 180, 165 180, 165 200" fill="none" stroke="#f59e0b" stroke-width="4" filter="url(#glow)"/>

    <!-- Right Pole Loop -->
    <path d="M 295 160 C 295 185, 320 185, 320 200" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.85"/>
    <path d="M 275 160 C 275 182, 290 182, 290 200" fill="none" stroke="#22c55e" stroke-width="3.5" opacity="0.95"/>
    <path d="M 255 160 C 255 180, 265 180, 265 200" fill="none" stroke="#f59e0b" stroke-width="4" filter="url(#glow)"/>

    <!-- Air Gap Indicator -->
    <line x1="60" y1="160" x2="60" y2="200" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="53" y1="160" x2="67" y2="160" stroke="#f43f5e" stroke-width="2"/>
    <line x1="53" y1="200" x2="67" y2="200" stroke="#f43f5e" stroke-width="2"/>
    <text x="48" y="184" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">g = 5 mm</text>

    <!-- Upward Magnetic Force Vector Arrow -->
    <line x1="215" y1="200" x2="215" y2="160" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <polygon points="215,152 209,165 221,165" fill="#38bdf8"/>
    <text x="215" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">F_mag ≥ 130 N</text>

    <!-- FEA Legend Scale (Bottom) -->
    <rect x="25" y="250" width="380" height="12" rx="4" fill="url(#fluxGrad)"/>
    <text x="25" y="274" fill="#94a3b8" font-family="monospace" font-size="10">0.0 T</text>
    <text x="120" y="274" fill="#94a3b8" font-family="monospace" font-size="10">0.6 T</text>
    <text x="215" y="274" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">1.2 T</text>
    <text x="310" y="274" fill="#94a3b8" font-family="monospace" font-size="10">1.6 T</text>
    <text x="405" y="274" fill="#ef4444" font-family="monospace" font-size="10" text-anchor="end" font-weight="bold">B_sat = 1.8 T</text>
  </g>

  <!-- Left Side: Typography and Meta Info -->
  <g transform="translate(50, 50)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="375" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="5" fill="#38bdf8"/>
    <text x="28" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
      TÜBİTAK 2209-B ÜNİVERSİTE-SANAYİ AR-GE PROJESİ
    </text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Electromagnetic Levitation
    </text>
    <text x="0" y="118" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">
      Ansys Maxwell FEA &amp; System Dynamics Suite
    </text>
    <text x="0" y="146" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">
      Elektromanyetik Levitasyon (Maglev) Tasarımı, Sonlu Elemanlar ve Kontrol Paketi
    </text>

    <!-- Engineering Spec Chips -->
    <g transform="translate(0, 180)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="145" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">HAVA ARALIĞI</text>
      <text x="12" y="31" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">g = 5 mm</text>

      <!-- Chip 2 -->
      <rect x="155" y="0" width="145" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="167" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">KALDIRMA KUVVETİ</text>
      <text x="167" y="31" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">F ≥ 130 N</text>

      <!-- Chip 3 -->
      <rect x="310" y="0" width="145" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="322" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">UYARMA AKIMI</text>
      <text x="322" y="31" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700">I_nom = 4.8 A</text>

      <!-- Chip 4 -->
      <rect x="465" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="477" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">KONTROL STRATEJİSİ</text>
      <text x="477" y="31" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PID + Anti-Windup</text>
    </g>

    <!-- University & Author Tagline -->
    <g transform="translate(0, 245)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
        🏛️ Karadeniz Teknik Üniversitesi (KTÜ) — Elektrik-Elektronik Mühendisliği
      </text>
      <text x="0" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">
        Proje Yürütücüsü: Muhammet Raşit Taflan | Destekleyen Kurum: TÜBİTAK TEYDEB / BİDEB
      </text>
    </g>
  </g>
</svg>
